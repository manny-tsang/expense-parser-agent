name: Jira Dynamic Transition on Push

on:
  push:
    branches:
      - main

jobs:
  transition-jira:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Find Jira Issue Key
        id: jira_keys
        uses: atlassian/gajira-find-issue-key@v3
        with:
          string: ${{ github.event.head_commit.message }}

      # =========================================================================
      # EPIC TRANSITIONS
      # =========================================================================

      # EPIC: NEW -> IN PROGRESS
      - name: "Epic Transition: Implementing"
        if: steps.jira_keys.outputs.issue && contains(github.event.head_commit.message, 'implementing')
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Implementing"
          comment: "Automated Epic Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # EPIC: IN PROGRESS -> DONE
      - name: "Epic Transition: Epic Completed"
        if: steps.jira_keys.outputs.issue && (contains(github.event.head_commit.message, 'epiccompleted') || contains(github.event.head_commit.message, 'epicdone'))
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Epic Completed"
          comment: "Automated Epic Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # =========================================================================
      # STORY TRANSITIONS
      # =========================================================================

      # 1. NEW -> IN DESIGN
      - name: "Transition: Defining"
        if: steps.jira_keys.outputs.issue && contains(github.event.head_commit.message, 'design')
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Defining"
          comment: "Automated Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # 2. IN DESIGN -> READY FOR DEV
      - name: "Transition: Defined"
        if: steps.jira_keys.outputs.issue && contains(github.event.head_commit.message, 'defined')
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Defined"
          comment: "Automated Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # 3. READY FOR DEV -> IN DEV
      - name: "Transition: In Sprint"
        if: steps.jira_keys.outputs.issue && (contains(github.event.head_commit.message, 'start') || contains(github.event.head_commit.message, 'indev'))
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "In Sprint"
          comment: "Automated Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # 4. IN DEV -> DEV COMPLETED
      - name: "Transition: Engineered"
        if: steps.jira_keys.outputs.issue && (contains(github.event.head_commit.message, 'engineered') || contains(github.event.head_commit.message, 'devcomplete'))
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Engineered"
          comment: "Automated Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # 5. DEV COMPLETED -> READY FOR TEST
      - name: "Transition: Assigned"
        if: steps.jira_keys.outputs.issue && (contains(github.event.head_commit.message, 'readyfortest') || contains(github.event.head_commit.message, 'testready'))
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Assigned"
          comment: "Automated Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # 6. READY FOR TEST -> IN TESTING
      - name: "Transition: Test Cases Defined"
        if: steps.jira_keys.outputs.issue && contains(github.event.head_commit.message, 'testing')
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Test Cases Defined"
          comment: "Automated Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # 7. IN TESTING -> TEST COMPLETED
      - name: "Transition: Test Cases Cleared"
        if: steps.jira_keys.outputs.issue && (contains(github.event.head_commit.message, 'cleared') || contains(github.event.head_commit.message, 'testcomplete'))
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Test Cases Cleared"
          comment: "Automated Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # 8. TEST COMPLETED -> READY FOR BUILD
      - name: "Transition: Awaiting Build"
        if: steps.jira_keys.outputs.issue && (contains(github.event.head_commit.message, 'awaitingbuild') || contains(github.event.head_commit.message, 'readyforbuild'))
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Awaiting Build"
          comment: "Automated Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # 9. READY FOR BUILD -> IN BUILD
      - name: "Transition: Build Assigned"
        if: steps.jira_keys.outputs.issue && contains(github.event.head_commit.message, 'inbuild')
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Build Assigned"
          comment: "Automated Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"

      # 10. IN BUILD -> DONE
      - name: "Transition: Deployed"
        if: steps.jira_keys.outputs.issue && (contains(github.event.head_commit.message, 'deployed') || contains(github.event.head_commit.message, 'done'))
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.jira_keys.outputs.issue }}
          transition: "Deployed"
          comment: "Automated Transition via GitHub Actions:\n\n${{ github.event.head_commit.message }}"